# Production overlay. Use together with the base file:
#
#   DOMAIN=spotule.example.com \
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Differences from local development:
#   - Caddy terminates TLS on :443 and is the only thing exposed to the internet.
#   - Postgres, Redis and the API are not published on the host; they are reachable only on
#     the internal compose network.
#   - Secure cookies, production app env, restart policies so the stream logger survives reboots.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to your hostname, e.g. spotule.example.com}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

  postgres:
    restart: unless-stopped
    ports: !override []

  redis:
    restart: unless-stopped
    ports: !override []

  api:
    restart: unless-stopped
    ports: !override []
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
      WEB_BASE_URL: https://${DOMAIN}
      API_BASE_URL: https://${DOMAIN}
      SPOTIFY_REDIRECT_URI: https://${DOMAIN}/api/v1/auth/callback

  worker:
    restart: unless-stopped
    environment:
      APP_ENV: production

  beat:
    restart: unless-stopped
    environment:
      APP_ENV: production

  web:
    restart: unless-stopped
    ports: !override []
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: ""

volumes:
  caddy_data:
  caddy_config:
