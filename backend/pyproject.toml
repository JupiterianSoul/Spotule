[project]
name = "spotimax-backend"
version = "0.1.0"
description = "SpotiMax — multi-user Spotify automation & analytics engine (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "redis>=5.0",
  "celery[redis]>=5.4",
  "cryptography>=42",
  "orjson>=3.10",
  "python-multipart>=0.0.9",
  "structlog>=24.1",
  "tenacity>=8.3",
  "ijson>=3.3",
  "aiofiles>=23.2",
  "croniter>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]

[tool.ruff]
extend-exclude = ["alembic/versions"]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
